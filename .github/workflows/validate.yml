name: validate

# The kit is configuration: nothing compiles, so a broken front matter or a machine-specific
# path only shows up when Claude Code silently stops loading an asset. This is the guardrail.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate assets, references, leaks and docs
        run: node tools/validate.mjs

      # One test file at a time: several tests write fixtures to the temp directory and spawn
      # shells, and a runner is small enough that the parallel speed-up is not worth a flaky run.
      - name: Test the hooks
        run: node --test --test-concurrency=1 tools/*.test.mjs

      - name: Syntax-check the status line
        run: |
          for f in statusline.js statusline/*.js; do
            node --check "$f"
          done

      - name: Syntax-check hooks and tools
        run: |
          for f in hooks/*.js hooks/lib/*.js tools/*.js tools/*.mjs; do
            [ -e "$f" ] || continue
            node --check "$f"
          done

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
              foreach ($e in $parseErrors) {
                  $failed = $true
                  $rel = [System.IO.Path]::GetRelativePath($PWD, $file.FullName)
                  Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
          }
          if ($failed) { exit 1 }
          Write-Host "all PowerShell scripts parse"
